<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>毕业典礼邀请函</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
  <link rel="icon" href="assets/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div class="wrapper">
    <div class="envelope">
      <div class="envelope__lid-one"></div>
      <div class="envelope__lid-two"></div>
      <div class="envelope__front-bottom"></div>
      <div class="envelope__front-right"></div>
      <div class="envelope__front-left"></div>
    </div>
    <div class="letter">
      <div class="letter__header">
        <h1>毕业典礼邀请函</h1>
      </div>
      <div class="letter__content">
        <p>尊敬的嘉宾：</p>
        <p>您好！</p>

        <p>值此毕业之际，小赵诚挚邀请您莅临<strong>滑铁卢大学数学系2025届毕业典礼</strong>，共同见证他求学路上的重要里程碑。</p>

        <h2>典礼信息</h2>
        <p><strong>日期：</strong>2025年6月11日（星期三）</p>
        <p><strong>时间：</strong>全天</p>
        <p><strong>地点：</strong>滑铁卢大学PAC门口草坪（BC Matthews Hall Green）</p>

        <p>诚挚的，</p>
        <p>小赵</p>
        <p>滑铁卢大学数学系</p>
        <p>计算机专业2025届毕业生</p>
      </div>
    </div>
  </div>
</body>

</html>
